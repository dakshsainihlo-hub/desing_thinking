<script>
const syllabus=[
{unit:1,title:'Foundations of Learning, Creativity & Design Thinking',short:'Learn how thinking, creativity and human-centred design work together.',topics:[
['Thinking and learning','Design Thinking begins with curiosity, experimentation and reflection. Metacognition means noticing how you think and learn.','Before solving creatively, understand how people learn, think, observe and generate ideas. Skills: self-awareness, creative confidence and critical thinking.'],
['Focused and diffuse thinking','Focused mode concentrates on a task using familiar pathways; diffuse mode relaxes attention and connects ideas broadly.','Equations, code and procedures use focused mode. Brainstorming and unexpected connections use diffuse mode. Alternate them: work hard first, then take a break. Diffuse thinking reorganises material already studied; it does not work on an empty mind.'],
['Learning frameworks: VARK','VARK describes preferences: Visual (diagrams), Auditory (listening), Reading/Writing (text), Kinesthetic (hands-on).','Activity 1.2 scores eight statements 1–5; V=1+5, A=2+6, R=3+7, K=4+8. Treat the result as reflection, not a prescription: controlled studies have not shown that teaching to a preferred style improves results. Retrieval practice, spacing and interleaving have stronger evidence in the slides.'],
['Functional fixedness','The habit of seeing an object only for its usual purpose, which blocks alternative solutions.','Paper clip: document holder, cable organiser, zipper pull, SIM ejector, reset tool, bookmark or keychain holder. To escape fixedness, list an object’s properties first, then find uses for each. A bucket’s hollowness, watertightness, strength, lightness, handle and acoustic quality suggest different uses.'],
['Cognitive blocks','Fear of failure, conformity, premature judgment and the expertise trap restrict idea generation.','Design Thinking counters these through empathy, experimentation, collaboration and structured creative problem-solving.'],
['Creativity, invention and innovation','Creativity makes original, useful ideas; invention creates something new; innovation implements ideas to create value.','Example: imagining a drone delivery system is creativity; creating a new device is invention; implementing a valuable service is innovation. Creativity becomes innovation only when it delivers value. Incremental invention improves an existing product; disruptive innovation can reshape markets around simpler or more accessible solutions.'],
['Kinds of problems','Well-defined problems have clear goals and one correct answer; ill-defined problems have unclear paths and many possible solutions; wicked problems are interconnected with better/worse outcomes rather than one right answer.','Equations and technical fixes are well-defined; app design and marketing strategy are ill-defined; climate, poverty and healthcare are wicked examples. Design Thinking is useful where linear methods alone are insufficient.'],
['Design Thinking: definition and beliefs','A human-centred approach to innovation and problem-solving that starts with users’ needs and experiences.','Three beliefs: understand problems from the user’s side; ideas improve through testing, not argument; early failure costs less than late failure. It uses iterative processes and practical solutions.'],
['History and evolution','Milestones shown: mid-1960s design-methods movement; 1969 Herbert Simon on design as a way of thinking; 1969–70s Rittel coins wicked problems; Nigel Cross (1991), Designerly Ways of Knowing; IDEO founded (1982–87); Stanford d.school established (2005); widespread application today.','Lawson’s experiment contrasts scientists (analyse before proposing) and designers (create and test many solutions rapidly). The timeline is taken from the unit slide.'],
['Stanford d.school: five stages','Empathize → Define → Ideate → Prototype → Test.','Understand needs, pinpoint the problem, generate ideas, build a simple model and evaluate with users. Testing feeds back into empathy: this is iterative, not linear.'],
['IDEO Human-Centred Design: three lenses','Desirability asks whether people want it; feasibility asks whether it can be built; viability asks whether it is economically sustainable.','Innovation lies where all three overlap. Meeting only one or two can produce a concept that fails in practice. These lenses complement the d.school workflow.'],
['Waterfall and HCD','Waterfall is linear: finish each phase before the next; user feedback arrives late, making changes costly. HCD iterates with empathy, prototypes and ongoing user feedback.','Waterfall: Plan → Build → Test → Ship. HCD: Empathize → Prototype → Test → loop. This distinction supports course outcome CO1.'],
['Case: Airbnb photography pivot','In 2009, low bookings and flat revenue were explained by visiting hosts: amateur listing photos discouraged bookings.','The founders photographed listings themselves; booking rates increased. Direct observation revealed a cause that data alone had not explained. The intervention did not scale, as the slide notes.'],
['Case: Google Glass','Google Glass (2013) combined camera, display and voice control but failed commercially.','The slides cite social recording concerns, awkward appearance, unclear use case and a $1,500 price. Enterprise Edition later targeted technicians who needed hands-free work and cared less about appearance. Lesson: technical innovation without desirability can fail; a product is good for someone, in context.'],
['Case: Aravind Eye Care','Founded in Madurai in 1976 by Dr. Govindappa Venkataswamy with eleven beds. The problem was access to existing cataract surgery.','Approach: assembly-line surgery, task-shifting to trained rural women, cross-subsidy by comfort tier (not surgical quality), locally made lenses via Aurolab, village outreach camps. The slide reports roughly half of patients pay little or nothing and the hospital is financially self-sustaining. Lesson: borrow analogies across industries; design affordability into the process.'],
['Design detective and mini-sprint','Observe designed and poorly designed campus objects and ask who benefits, who struggles and what one change would help.','Capstone: list object properties; empathize; define the real problem; sketch three alternatives; pitch. For success/failure analysis identify users, problem, applied or ignored DT principles and how research could help.'],
['Unit 1 wrap-up','Focused and diffuse modes work together; creativity becomes innovation through value; d.school and IDEO are complementary; products are good or bad for particular users.','Remember: Notice → Question → Reframe → Create → Deliver Value. Sources named in slides: Kelley & Kelley, Creative Confidence; Brown, Change by Design.']
]},
{unit:2,title:'Empathy, Observation & Problem Identification',short:'Understand users before designing solutions.',topics:[
['Empathy','Understand another person’s feelings, experiences, motivations, frustrations and goals from their point of view.','It reveals hidden needs and helps solve actual rather than assumed problems. See, feel and listen. You are not the user: your experience is one hypothesis, not the whole sample.'],
['Sympathy, empathy and compassion','Sympathy feels for someone from a distance; empathy understands a situation as the person experiences it; compassion adds a decision to act.','Design example: pity notices a lost student; empathy observes confusing building numbers; compassion changes the signage. Slides summarise: empathy produces design; compassion produces change.'],
['Computational empathy','Applying empathy in software: systems understand and respond to human emotions and behaviour, often using AI.','Examples shown: chatbots infer intent, Netflix recommends to suit mood, Spotify matches listening habits, health apps monitor wellbeing, education apps adapt to performance. A machine may simulate empathic behaviour; the slide frames this as a class debate.'],
['Case: CoWIN','During COVID-19 India needed vaccination scheduling and certification at national scale across varied digital literacy, connectivity, languages and abilities.','A rigid flow could exclude users. Response: self-service and assisted pathways, a common backend with multiple front ends, QR-verifiable certificates and third-party slot APIs. Design for the least-connected user.'],
['User research','A process for understanding users’ needs, behaviours, goals and challenges before creating solutions.','Ask who the users are, what problems they face, what they expect and what motivates them. Research reduces assumptions and supports evidence-based decisions.'],
['Qualitative and quantitative research','Qualitative explores why/how using words, behaviour and emotion; quantitative measures what/how many using numbers and metrics.','Methods: interviews, observations, focus groups vs surveys, analytics and A/B tests. Slides give small purposive samples (5–20) vs larger (100+). Discover insights qualitatively, then validate at scale quantitatively; they are partners.'],
['Field observation','Watch users in their natural environment to understand actual behaviour rather than relying only on what they report.','Be a fly on the wall: do not interrupt or influence behaviour; take discreet notes. Record observations, not judgments.'],
['AEIOU observation framework','Activities, Environment, Interactions, Objects, Users: five lenses for systematic observation.','Activities = what people do; Environment = where; Interactions = how they engage; Objects = tools used; Users = who they are and their role/context. Example scan: photocopy-shop workflow, counter/noise/rate card, operator exchange, phone/USB/register, mostly first-years between classes. Keep interpretations separate from facts.'],
['Research ethics and consent','Ask permission before interviewing or photographing; introduce yourself; use pseudonyms/initials; do not photograph people; meet safely in public places and daylight, preferably in pairs.','Consent script: explain INT335 project, five-minute voluntary conversation, right to stop or skip, anonymous notes for class use, then ask if they agree. Public observation is okay; studying an individual requires consent. Avoid residential spaces; ask a faculty mentor if unsure.'],
['What–How–Why','A three-step bridge from observed behaviour to possible motivation.','WHAT records observable actions/tools; HOW examines process, effort, emotions and challenges; WHY infers motivations, emotions and needs. Label inference as inference. Observation without interpretation is data; interpretation without observation is guesswork.'],
['User interviews: good questions','Ask open-ended, non-leading, exploratory questions about real experiences, not hypothetical solutions.','Replace “Do you like the library?” with “Tell me about your experience using the library.” Ask “Walk me through…” Listen more than you talk (80/20); do not defend your ideas.'],
['Seven interviewing techniques','Five Whys; “Tell me a story” about a specific past event; “Show me”; embrace 3–5 seconds of silence; follow emotions; seek contradictions gently; grand tour of a typical routine.','The Five Whys peels back causes. Silence often lets a participant add what they had not planned to say. A grand-tour question asks for a step-by-step account.'],
['Unbiased interviewing and question traps','An unbiased interview lets users share freely without interviewer influence.','Avoid closed, leading, hypothetical or solution-led questions. “Wouldn’t it be great if the mess had an app?” is leading and solution-led; “Do you ever have trouble…?” is closed; “Why don’t you just go earlier?” is blaming and damages trust. Ask about current behaviour and specific past experiences.'],
['Explicit and implicit needs','Explicit needs are stated directly; implicit needs are unspoken and revealed through observation and analysis.','“I want faster checkout” may imply a need for control. “I want more features” may hide a need for simplicity and guidance. Safety, confidence, comfort, emotional support and trust may be implicit needs.'],
['Say–do gap','The difference between what people report and what they actually do.','Slides’ coffee example: shoppers said they preferred a lighter roast, yet most chose dark when offered a free cup. Ask what people do and watch what they choose; stated preference and observed behaviour are different evidence.'],
['Pain points','Specific problems or frustrations people encounter while trying to reach a goal.','Categories shown: process (inefficiency), support (lack of help), financial (cost of money/time), productivity (wasted time/effort). Every recorded pain point needs evidence: a quote or count.'],
['Case: Namma Yatri','The unit studies the driver, not only the rider. Drivers faced commission reducing take-home pay, opaque algorithm changes and no appeal route.','Core pain point: powerlessness, not merely price. Define: auto drivers need predictable, dignified incomes because commission structures and opaque algorithms undermine earnings and control. The slide reports a Bengaluru zero-commission subscription pilot on open protocols. Lesson: include service providers in research.'],
['Personas and target archetypes','A persona is a fictional individual profile based on real research; an archetype is a broad group with shared behaviours and needs.','Persona components: realistic pseudonymous name, demographics/role/location, goals, frustrations, motivation, needs, behaviours and a representative quote. Every line must trace to something a real person said or did; do not invent decorative traits. Archetypes segment groups; personas make one group concrete.'],
['Empathy maps','A synthesis tool organising what users SAY, THINK, DO and FEEL.','Say = direct quotes; Think = beliefs/concerns; Do = observable action; Feel = emotion/attitude. Look for mismatch (e.g., says app is easy but repeatedly replays lectures and searches elsewhere): gaps reveal opportunities.'],
['Problem statements and HMW','Format: [User] needs [need] because [insight]. A How Might We question reframes that challenge as an opportunity.','Avoid embedding a solution (“we need an app”). Example: first-year students need an easy way to navigate because they get lost and worry about lateness. HMW should be neither too broad nor smuggle in a solution: aim at a real need with room for ideas.'],
['Unit 2 capstone and wrap-up','Observe with AEIOU and count something; interview with consent and open questions; use Five Whys; separate explicit/implicit needs; create a research-traceable persona and empathy map; frame a problem and HMW.','Remember: you are not the user; mind the say–do gap; the first Why is rarely the real one; every persona line needs evidence. Flow: Observe → Interview → Synthesise → Persona → Frame.']
]},
{unit:3,title:'Ideation & Creative Problem Solving',short:'Generate broadly, organise evidence, and choose ideas deliberately.',topics:[
['Ideation','Generate and explore creative alternatives to solve a problem. Emphasise quantity before quality and defer judgment.','It encourages creativity, collaboration, innovation and user-centred solutions. Workflow: problem → generate → select → prototype → test → implement. Example in the slides: study planner for deadlines.'],
['Creative Problem Solving (CPS)','A structured process combining creativity and analysis to identify problems, generate ideas, evaluate choices and implement a solution.','Four stages: Clarify (find real problem and user needs); Ideate (many ideas); Develop (evaluate, compare and improve); Implement (prototype, test, gather feedback, improve and launch). The process alternates opening up and narrowing.'],
['Divergent and convergent thinking','Divergent thinking expands possibilities and generates ideas without judgment; convergent thinking narrows options using evidence and selects.','Run them in sequence, not at once. Early evaluation can kill promising ideas; endless ideation avoids a decision. Convergent thinking weighs trade-offs rather than finding a perfect answer.'],
['Constraint framing','Identify requirements and limits that guide realistic, focused problem-solving.','Types: financial, time, technical, legal and environmental; also human-resource limits. Example electric-bike brief: ₹25,000 budget, battery under 4 kg, maximum speed 25 km/h, eco-friendly materials. Constraints can become design prompts, not just obstacles.'],
['How Might We statements','An open-ended question that converts an evidenced problem into an opportunity for innovation.','Structure includes question/opportunity, action, user and desired goal. Example: help students remember assignment deadlines. Avoid too broad (“improve education”) or too narrow (specifying a red button). Convert a constraint into an opportunity, then ideate.'],
['Brainstorming and its seven rules','A structured group method to generate many ideas without criticism.','Defer judgment; seek quantity; welcome wild ideas; build with “Yes, and…”; stay focused on the HMW; have one conversation; be visual. Osborn’s four foundations: suspend judgment, think freely, quantity matters, combine and improve.'],
['Brainstorming process and rapid sprint','Clarify objective; generate; record every idea; organise similar ideas; assess feasibility and impact; select.','Slides distinguish steps 1–4 as divergent and 5–7 as convergent. Sprint: 8 minutes, at least 30 ideas, no judgment; record total and ideas from final two minutes. A Smart Campus activity uses groups of five, 10 ideas in 5 minutes, then categories.'],
['Idea generation','Create, explore and develop multiple possible solutions; combine and improve before evaluation.','Sequence: problem → research → generate → combine/improve → evaluate → best solution. Supports innovation, complex-problem solving, decisions, collaboration and competitive advantage.'],
['SCAMPER framework','Seven prompts developed by Bob Eberle to transform an existing product, service or process.','S Substitute (replace); C Combine (merge); A Adapt (borrow); M Modify (change size/form/features); P Put to another use; E Eliminate (remove); R Reverse/Rearrange (change order/direction).'],
['SCAMPER: Substitute and Combine','Substitute replaces material, part, process, person or technology; Combine merges products, ideas, features or processes.','Examples: plastic bags → cloth bags; petrol cars → electric; printed books → e-books. Pen + USB = pen drive; backpack + solar charger = solar backpack.'],
['SCAMPER: Adapt and Modify','Adapt borrows or modifies ideas from another industry, product, environment or nature; Modify changes size, appearance, shape, performance or features.','Biomimicry examples: Velcro/plant burr hooks; bullet-train nose/kingfisher beak; self-cleaning paint/lotus leaves. Modify examples: foldable phone, mini projector, compact EV; magnify or minify.'],
['SCAMPER: Put to another use, Eliminate, Reverse','Put to another use gives an existing object a new context; Eliminate removes unnecessary parts; Reverse/Rearrange changes order, direction, sequence or roles.','Examples: bottle → garden pot/bird feeder; umbrella also shades/protects from wind; simplify a cluttered app; reverse shopping into browse/order/delivery. Eliminate and Reverse can question foundational assumptions.'],
['SCAMPER worked example: campus bus','Apply each prompt to the hostel–academic shuttle: demand-based departures; combine parcel run; airport-style departure screen; smaller frequent vehicles; use buses as shaded seating/charging; replace a short stop with walkway; move classes closer together.','SCAMPER fills the table, it does not certify that an idea is good. The hardest prompt often exposes an assumption.'],
['Crazy 8s','Fold a sheet into eight panels and sketch eight distinct ideas, one minute per panel.','No talking, no erasing; each panel must be a different idea, not a refinement. A box, arrow and three words count as a sketch. Time pressure limits self-censoring.'],
['Mind mapping','Visual organisation around a central topic using branches, keywords, colours, symbols and images to show hierarchy/relationships.','Components: central idea, main branches, sub-branches, short keywords. Steps: write topic, create branches, add sub-branches, expand, highlight relationships, review/refine. Smart city branches include transport, healthcare, education, energy and security; smart hospital includes patient care, technology, support, security and infrastructure.'],
['Reverse thinking and inversion','Reverse thinking asks how to make a problem worse, then flips each answer into a design instruction. Inversion asks what to avoid to prevent failure.','Crowded library: show seat availability; auto-release unused seats; distribute sockets; zone silent/group spaces; extend hours before exams. Inversion steps: define goal → imagine failure → identify causes → reverse causes → implement better solutions.'],
['Idea clustering and affinity mapping','Group related ideas, name clusters and inspect patterns before evaluating.','Write one idea per note; group related ideas in silence; name each cluster; review relationships; then discuss patterns. Clusters—not single notes—become the shortlist. Sparse clusters can reveal unexplored opportunities.'],
['Case: Zerodha and reframing','Instead of optimising brokerage percentages, Zerodha asked why pricing was percentage-based and how to serve a first-time investor.','The slides describe flat-fee trades, software over salespeople, education as a product and no outside funding. Lesson: examine assumptions embedded in a problem; a better question can produce different solutions.'],
['Feasibility and relevance','Feasibility: can we implement it? Relevance: does it solve the user’s actual problem?','Feasibility dimensions: technical, economic, operational, legal and schedule. A strong idea is practical and addresses a genuine pain point, not a convenient one.'],
['2×2 prioritisation and weighted screening','Relevance × feasibility groups ideas: Quick wins (high/high), Consider (high relevance/low feasibility), Low priority (low relevance/high feasibility), Avoid (low/low).','Weighted matrix makes a defensible choice: set criteria and weights first, score alternatives, multiply score by weight, sum weighted totals. Slide criteria include user value ×3, feasibility ×2, novelty ×1, speed ×2, cost ×1. Weights shape what “best” means.'],
['Idea selection and prioritisation','Selection chooses the most suitable idea; prioritisation ranks by importance, urgency, impact and feasibility.','Consider business value, customer benefit, innovation, cost, time, risk and strategic alignment. Impact–effort matrix: high impact/low effort = top priority; high/high = strategic; low/low = low priority; low impact/high effort = avoid. Use relevance/feasibility to shortlist, impact/effort to schedule.'],
['Unit 3 capstone and wrap-up','Clarify real problem; list constraints and reframe one; write HMW and remove an assumption; diverge; cluster; converge with 2×2 and weighted matrix.','Innovation Mission: generate 100 ideas in a week using different techniques. Remember: never judge and generate together; late ideas may be wild; SCAMPER fills the table; better questions beat more answers; weighted matrices make choices explainable. Flow: Clarify → Diverge → Cluster → Evaluate → Prioritise.']
]}
];

function mcq(){if(quizDone)return `${header('PRACTICE COMPLETE','Nice work.','That practice set is complete. Review your accuracy or choose another set.')}<div class="grid stats"><div class="card stat"><div class="stat-head">Total attempted</div><div class="stat-num">${state.mcqs}</div></div><div class="card stat"><div class="stat-head">Overall accuracy</div><div class="stat-num">${state.mcqs?Math.round(state.correct/state.mcqs*100):0}%</div></div><div class="card stat"><div class="stat-head">Questions to retry</div><div class="stat-num">${state.incorrect.length}</div></div></div><div class="card"><button class="btn" onclick="startQuiz('all')">Start another shuffled practice →</button> <button class="btn secondary" onclick="startQuiz('wrong')">Retry missed questions</button></div>`;if(!quizSet.length)quizSet=questions.slice();let q=quizSet[quizIndex%quizSet.length];let us=syllabus.map(u=>{let x=state.unitStats[u.unit]||{n:0,c:0};return `<div class="list-row"><div class="row-main"><b>Unit ${u.unit} · ${['Foundations','Empathy & research','Ideation'][u.unit-1]}</b><small>${x.n?Math.round(x.c/x.n*100)+'% accuracy · '+x.n+' attempts':'No attempts yet'}</small></div></div>`}).join('');let savedQs=state.bookmarks.filter(x=>x.startsWith('q')).map(x=>questions.find(z=>'q'+z.id===x)).filter(Boolean);return `${header('ACTIVE RECALL','MCQ practice.','Check what you know, one question at a time. Explanations appear after you submit.')}<div class="grid two" style="margin-bottom:15px"><div class="card"><div class="stat-head">Question bank</div><div class="stat-num" style="font-size:20px">${questions.length} questions</div><small class="sub">Across all 3 units · mixed difficulty</small></div><div class="card"><div class="stat-head">Your practice</div><div class="stat-num" style="font-size:20px">${state.mcqs} <small class="sub">attempts</small></div><small class="sub">${state.mcqs?Math.round(state.correct/state.mcqs*100):0}% overall accuracy · ${state.incorrect.length} to retry · ${savedQs.length} bookmarked</small></div></div><div class="card mcq-box"><div class="quiz-top"><span>QUESTION ${quizIndex+1} / ${quizSet.length}</span><span>UNIT ${q.unit} · ${q.id<7?'EASY':q.id<14?'MEDIUM':'CHALLENGE'}</span></div><div class="bar"><i style="width:${(quizIndex+1)/quizSet.length*100}%"></i></div><div class="question">${q.question}</div><div class="options">${q.options.map((o,i)=>`<button class="option ${selected===i?'selected':''} ${submitted&&i===q.answer?'correct':''} ${submitted&&selected===i&&i!==q.answer?'wrong':''}" onclick="choose(${i})" ${submitted?'disabled':''}><b style="color:var(--gold);margin-right:10px">${'ABCD'[i]}</b>${o}</button>`).join('')}</div>${submitted?`<div class="feedback"><b style="color:${selected===q.answer?'var(--green)':'var(--red)'}">${selected===q.answer?'Correct':'Not quite'}</b> · ${q.explanation}</div>`:''}<div class="quiz-controls"><button class="btn secondary" onclick="bookmarkQuestion(${q.id})">${state.bookmarks.includes('q'+q.id)?'★ Bookmarked':'☆ Bookmark'}</button>${submitted?`<button class="btn" onclick="nextQ()">${quizIndex+1===quizSet.length?'Finish':'Next question'} →</button>`:`<button class="btn" onclick="submitQ()" ${selected===null?'disabled':''}>Check answer</button>`}</div></div><div class="grid two"><div><div class="section-row"><div><h2>Practice mode</h2><p class="sub">Choose one unit, retry misses, or shuffle all questions.</p></div></div><div class="card" style="display:flex;gap:8px;flex-wrap:wrap">${syllabus.map(u=>`<button class="btn secondary" onclick="startQuiz('${u.unit}')">Unit ${u.unit} · ${u.title.split(' ').slice(0,3).join(' ')}</button>`).join('')}<button class="btn" onclick="startQuiz('all')">Shuffle all units</button><button class="btn red" onclick="startQuiz('wrong')">Retry missed (${state.incorrect.length})</button></div></div><div><div class="section-row"><div><h2>Topic performance</h2><p class="sub">Accuracy by unit in this browser.</p></div></div><div class="card">${us}</div></div></div><div class="section-row"><div><h2>Bookmarked questions</h2><p class="sub">Saved here for another practice run.</p></div></div><div class="card">${savedQs.length?savedQs.map(z=>`<div class="list-row"><div class="row-main"><b>${z.question}</b><small>Unit ${z.unit} · ${z.id<7?'Easy':z.id<14?'Medium':'Challenge'}</small></div><button class="text-link" onclick="startQuiz('${z.unit}')">Practice unit →</button></div>`).join(''):'<p class="sub">Bookmark a question while practising and it will appear here.</p>'}</div>`}
function choose(i){if(submitted)return;selected=i;render()}function submitQ(){if(selected===null)return;let q=quizSet[quizIndex%quizSet.length];submitted=true;state.mcqs++;state.unitStats[q.unit]??={n:0,c:0};state.unitStats[q.unit].n++;if(selected===q.answer){state.correct++;state.unitStats[q.unit].c++;state.incorrect=state.incorrect.filter(id=>id!==q.id)}else if(!state.incorrect.includes(q.id))state.incorrect.push(q.id);save();render()}function nextQ(){quizIndex++;selected=null;submitted=false;if(quizIndex>=quizSet.length){quizSet=[];quizDone=true;render()}else render()}
function priority(){let buckets=[['Must Learn','Foundational concepts and essential syllabus content',topics.filter(t=>['Design Thinking: definition and beliefs','Empathy','Divergent and convergent thinking','Stanford d.school: five stages','IDEO Human-Centred Design: three lenses','Problem statements and HMW','SCAMPER framework'].includes(t.title))],['High Priority','Core frameworks, methods and comparisons in the supplied units',topics.filter(t=>['Qualitative and quantitative research','AEIOU observation framework','What–How–Why','User interviews: good questions','Explicit and implicit needs','Brainstorming and its seven rules','Feasibility and relevance'].includes(t.title))],['Practice Thoroughly','Application and decision tools to rehearse',topics.filter(t=>['SCAMPER: Substitute and Combine','SCAMPER: Adapt and Modify','SCAMPER: Put to another use, Eliminate, Reverse','2×2 prioritisation and weighted screening','Idea selection and prioritisation','Reverse thinking and inversion','Constraint framing'].includes(t.title))],['Quick Revision','Short definitions, lists and memorable distinctions',topics.filter(t=>['Creativity, invention and innovation','Kinds of problems','Sympathy, empathy and compassion','Target archetypes — and how they differ','Convergent and divergent thinking','Mind mapping','Functional fixedness'].includes(t.title))]];return `${header('REVISION GUIDE','High-priority exam topics.','A syllabus-based revision guide, not a prediction of what will appear. No past papers were provided.')}<div class="grid priority-grid">${buckets.map((b,i)=>`<div class="card"><div class="eyebrow">0${i+1} · ${b[0]}</div><p class="sub" style="margin:6px 0 13px">${b[1]}</p>${b[2].map(t=>`<div class="priority-item"><h3>${t.title} <span class="tag">Unit ${t.unit}</span></h3><p>${t.definition} <button class="text-link" onclick="setPage('notes');setTimeout(()=>{let d=document.getElementById('topic-${t.key}');d.open=true;d.scrollIntoView({behavior:'smooth'})},60)">Notes →</button> <button class="text-link" onclick="startQuiz('${t.unit}')">Practice →</button></p></div>`).join('')}</div>`).join('')}</div>`}
function importantQuestions(){let types=[['Very short answer',['Define empathy.','What does SCAMPER stand for?','What is functional fixedness?','Name the four empathy-map quadrants.']],['Short answer',['Differentiate qualitative and quantitative research with methods and use cases.','Explain the three IDEO HCD lenses.','Describe the AEIOU framework with a campus example.']],['Long answer',['Explain the five d.school stages and why the process is iterative.','Describe CPS stages and show how divergent and convergent thinking alternate.','Explain how to use SCAMPER to improve a campus shuttle.']],['Differences and applications',['Distinguish sympathy, empathy and compassion.','Compare personas and target archetypes.','Compare reverse thinking and inversion.']],['Problem-solving practice',['A library is crowded. Use reverse thinking to derive four testable design ideas.','Create a relevance × feasibility and impact × effort recommendation for three ideas; state your criteria.']]];return `${header('EXAM PRACTICE','Important questions & answers.','Practice prompts based on course content. These are not guaranteed exam questions.')}<div class="card" style="margin-bottom:14px"><span class="pill">Answer structure</span><p class="sub" style="margin:9px 0 0">Start with a direct definition, organise key points under headings, add one relevant example, and close with the implication. For comparison questions, state the basis of comparison explicitly.</p></div>${types.map(([name,qs],i)=>`<details class="topic" ${i===0?'open':''}><summary><b>${name}</b><span class="pill">${qs.length} prompts</span></summary><div class="topic-body">${qs.map((q,j)=>{let linked=topics.find(t=>q.toLowerCase().includes(t.title.split(':')[0].toLowerCase().slice(0,10)));return `<details style="padding:10px 0;border-top:1px solid var(--line)"><summary style="padding:5px 0;list-style:none;cursor:pointer;color:var(--text);font-size:12px">${j+1}. ${q}</summary><p style="margin-top:10px"><b style="color:var(--gold)">Key points for a strong answer</b><br>${linked?linked.definition+' '+linked.note: 'Define the relevant concept from the notes, explain its stages or criteria in a logical order, use an example from the unit, and state what the method helps a designer decide or understand.'}</p><span class="tag">Practice question</span><button class="text-link" onclick="setPage('notes')">Review notes →</button></details>`}).join('')}</div></details>`).join('')}`}
function flashcards(){let deck=topics.map(t=>({front:t.title,back:t.definition+' '+t.note,unit:t.unit,key:t.key}));let card=deck[flashIndex%deck.length],status=state.cardStatus[card.key];let queue=deck.filter(c=>state.cardStatus[c.key]&&state.cardStatus[c.key]!=='Know It');return `${header('SPACED REVISION','Flashcards.','Recall first. Reveal, rate, then revisit the cards that need work.')}<div class="unit-overview" style="margin-bottom:14px"><span>Card ${flashIndex+1} of ${deck.length} · Unit ${card.unit}</span><span class="pill">${status||'New card'}</span><span style="margin-left:auto">Revision queue: ${queue.length}</span></div><div class="card flashcard" onclick="flashShow=!flashShow;render()"><div class="face">${flashShow?`<div class="eyebrow">ANSWER</div><p class="answer">${card.back}</p>`:`<div class="eyebrow">QUESTION · UNIT ${card.unit}</div><h2 style="margin-top:13px">${card.front}</h2><p class="sub">Tap to reveal answer</p>`}</div></div><div class="flash-nav"><button class="btn secondary" onclick="prevCard()">← Previous</button><button class="btn secondary" onclick="flashShow=!flashShow;render()">${flashShow?'Show question':'Reveal answer'}</button><button class="btn secondary" onclick="nextCard()">Next →</button></div><div class="section-row"><div><h2>How well did you know it?</h2><p class="sub">Your ratings save in this browser and feed the revision queue.</p></div></div><div class="card" style="display:flex;gap:9px;flex-wrap:wrap"><button class="btn" onclick="rateCard('${card.key}','Know It')">✓ Know it</button><button class="btn secondary" onclick="rateCard('${card.key}','Needs Practice')">↺ Needs practice</button><button class="btn red" onclick="rateCard('${card.key}','Review Again')">Review again</button></div><div class="section-row"><div><h2>Revision queue</h2><p class="sub">Marked cards, ordered by syllabus.</p></div></div><div class="card">${queue.length?queue.map(c=>`<div class="list-row"><div class="row-main"><b>${c.front}</b><small>Unit ${c.unit} · ${state.cardStatus[c.key]}</small></div><button class="text-link" onclick="flashIndex=${deck.indexOf(c)};flashShow=false;render()">Review</button></div>`).join(''):'<p class="sub">No difficult cards yet. Rate a card to build your queue.</p>'}</div>`}
function nextCard(){flashIndex=(flashIndex+1)%topics.length;flashShow=false;render()}function prevCard(){flashIndex=(flashIndex+topics.length-1)%topics.length;flashShow=false;render()}function rateCard(key,value){state.cardStatus[key]=value;save();nextCard()}
function mockPage(){if(mock?.active){return `${header('TIMED PRACTICE','Mock test in progress.','Answers stay hidden until you submit.')}<div class="card mcq-box"><div class="quiz-top"><span>QUESTION ${mock.i+1} / ${mock.qs.length}</span><span id="countdown">${fmtTime(mock.left)}</span></div><div class="bar"><i style="width:${(mock.i+1)/mock.qs.length*100}%"></i></div><div class="question">${mock.qs[mock.i].question}</div><div class="options">${mock.qs[mock.i].options.map((o,j)=>`<button class="option ${mock.ans[mock.i]===j?'selected':''}" onclick="mockChoose(${j})"><b style="color:var(--gold);margin-right:10px">${'ABCD'[j]}</b>${o}</button>`).join('')}</div><div class="quiz-controls"><button class="btn secondary" onclick="mockMove(-1)" ${mock.i===0?'disabled':''}>← Previous</button><div style="display:flex;gap:8px"><button class="btn secondary" onclick="mock.review[mock.i]=!mock.review[mock.i];render()">${mock.review[mock.i]?'★ Marked':'☆ Mark review'}</button><button class="btn secondary" onclick="mockMove(1)">Next →</button></div></div><div class="section-row"><div><h2>Question navigator</h2></div><button class="btn red" onclick="submitMock()">Submit test</button></div><div style="display:flex;gap:6px;flex-wrap:wrap">${mock.qs.map((_,i)=>`<button class="icon-btn" style="${i===mock.i?'border-color:var(--gold);color:var(--gold)':''}" onclick="mock.i=${i};render()">${i+1}${mock.review[i]?'★':''}</button>`).join('')}</div></div>`}if(mock&&!mock.active)return mockResult();return `${header('EXAM SIMULATION','Mock tests.','Practice with a timer and review your answers after submission.')}<div class="grid three"><div class="card"><div class="eyebrow">UNIT TEST</div><h2 style="margin:9px 0">One unit at a time</h2><p class="sub">10 questions · 12 minutes</p><div class="planner-form"><select id="mockUnit" class="select"><option value=1>Unit 1 · Foundations</option><option value=2>Unit 2 · Empathy & research</option><option value=3>Unit 3 · Ideation</option></select><button class="btn" onclick="beginMock('unit',Number(document.getElementById('mockUnit').value))">Start unit test</button></div></div><div class="card"><div class="eyebrow">SUBJECT TEST</div><h2 style="margin:9px 0">Full subject</h2><p class="sub">15 questions · 20 minutes</p><button class="btn" onclick="beginMock('subject')">Start subject test</button></div><div class="card"><div class="eyebrow">FULL SYLLABUS</div><h2 style="margin:9px 0">Exam simulation</h2><p class="sub">20 questions · 30 minutes</p><button class="btn" onclick="beginMock('full')">Start full test</button></div></div><div class="card" style="margin-top:18px"><h3>Test controls</h3><p class="sub">Move between questions, mark items for review and submit when ready. Correct answers and explanations appear only after submission. These are syllabus-based practice tests.</p></div>`}
function beginMock(kind,unitNo){let count=kind==='unit'?10:kind==='subject'?15:20;let pool=kind==='unit'?questions.filter(q=>q.unit===unitNo):questions;let qs=pool.slice().sort(()=>Math.random()-.5).slice(0,count);mock={active:true,qs,i:0,ans:Array(count).fill(null),review:Array(count).fill(false),left:kind==='unit'?720:kind==='subject'?1200:1800,started:Date.now()};tick();render()}function tick(){clearInterval(timer);timer=setInterval(()=>{if(!mock?.active){clearInterval(timer);return}mock.left--;let x=document.getElementById('countdown');if(x)x.textContent=fmtTime(mock.left);if(mock.left<=0)submitMock(true)},1000)}function fmtTime(n){return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}function mockChoose(i){mock.ans[mock.i]=i;render()}function mockMove(d){mock.i=Math.max(0,Math.min(mock.qs.length-1,mock.i+d));render()}function submitMock(auto=false){if(!mock?.active)return;if(!auto&&!confirm('Submit this mock test now? Answers will be revealed on the review screen.'))return;mock.active=false;mock.score=mock.qs.reduce((n,q,i)=>n+(mock.ans[i]===q.answer),0);mock.elapsed=Math.floor((Date.now()-mock.started)/1000);clearInterval(timer);save();render()}function mockResult(){let m=mock;return `${header('TEST COMPLETE','Your review.','Use missed questions to guide your next revision session.')}<div class="grid stats"><div class="card stat"><div class="stat-head">Score</div><div class="stat-num">${m.score}<span style="color:var(--muted);font-size:15px">/${m.qs.length}</span></div></div><div class="card stat"><div class="stat-head">Percentage</div><div class="stat-num">${Math.round(m.score/m.qs.length*100)}%</div></div><div class="card stat"><div class="stat-head">Accuracy</div><div class="stat-num">${Math.round(m.score/m.qs.length*100)}%</div></div><div class="card stat"><div class="stat-head">Time taken</div><div class="stat-num">${fmtTime(m.elapsed)}</div></div></div><div class="card">${m.qs.map((q,i)=>`<div class="list-row" style="align-items:flex-start"><div class="bullet" style="color:${m.ans[i]===q.answer?'var(--green)':'var(--red)'}">${m.ans[i]===q.answer?'✓':'!'}</div><div class="row-main"><b>${q.question}</b><small>Your answer: ${m.ans[i]===null?'Not answered':q.options[m.ans[i]]} · Correct: ${q.options[q.answer]}</small><small style="display:block;margin-top:5px">${q.explanation}</small><button class="text-link" onclick="setPage('notes');unitFilter='${q.unit}'">Review Unit ${q.unit} notes →</button></div></div>`).join('')}<button class="btn" style="margin-top:15px" onclick="mock=null;setPage('mock')">Back to mock tests</button></div>`}
function reference(){let comps=[['Frameworks & flows','d.school','Empathize → Define → Ideate → Prototype → Test','IDEO HCD','Desirability + Feasibility + Viability','CPS','Clarify → Ideate → Develop → Implement','Idea process','Problem → Research → Generate → Combine/Improve → Evaluate'],['Methods & prompts','AEIOU','Activities · Environment · Interactions · Objects · Users','What–How–Why','Observe → analyse action → infer motivation/need','HMW','How might we [action] for [user] to achieve [goal]?','Problem statement','[User] needs [need] because [insight]'],['SCAMPER','S','Substitute','C','Combine','A','Adapt','M','Modify','P','Put to another use','E','Eliminate','R','Reverse / Rearrange'],['Decision tools','Relevance × Feasibility','Quick wins high/high · Consider high/low · Low priority low/high · Avoid low/low','Impact × Effort','Top priority high impact/low effort · Strategic high/high · Low priority low/low · Avoid low impact/high effort','Weighted score','criterion score × agreed weight, summed across criteria'],['Definitions and distinctions','Creativity','Original, useful ideas','Invention','Create something new','Innovation','Implement ideas to create value','Qualitative research','Why/how · words, behaviours, emotions','Quantitative research','What/how many · numbers and metrics','Persona','Research-grounded fictional user profile','Archetype','Broad group with shared needs/behaviour']];return `${header('QUICK REFERENCE','Frameworks at a glance.','Only concepts relevant to this Design Thinking syllabus.')}<div class="grid two">${comps.map((group,i)=>`<div class="card"><div class="eyebrow">0${i+1} · ${group[0]}</div><table class="data-table"><tbody>${Array.from({length:(group.length-1)/2},(_,j)=>`<tr><td>${group[1+j*2]}</td><td>${group[2+j*2]}</td></tr>`).join('')}</tbody></table></div>`).join('')}</div><div class="section-row"><div><h2>Course models and shortcuts</h2><p class="sub">Compact revision cues from the slides.</p></div></div><div class="card"><div class="grid two"><div><h3>Brainstorming</h3><p class="sub">Defer judgment · quantity · wild ideas · build on others · focused HMW · one conversation · visualise.</p></div><div><h3>Interviewing</h3><p class="sub">Open-ended · non-leading · specific past events · show me · silence · follow emotion · seek contradiction gently · grand tour.</p></div><div><h3>Study strategies noted in Unit 1</h3><p class="sub">Retrieval practice · spacing · interleaving. VARK is for reflection, not a proven matching prescription.</p></div><div><h3>Common errors</h3><p class="sub">Assuming you are the user · judging during ideation · treating inference as observation · inventing persona details · choosing before criteria are set.</p></div></div></div>`}
function planner(){return `${header('MAKE A PLAN','Study planner.','Set your date and daily target; build a small, realistic revision queue.')}<div class="grid two"><div class="card"><div class="eyebrow">YOUR PLAN</div><div class="planner-form"><label style="font-size:11px;color:var(--muted)">Exam date<br><input id="examDate" type="date" value="${state.examDate||''}" onchange="state.examDate=this.value;save();render()"></label><label style="font-size:11px;color:var(--muted)">Daily goal (hours)<br><input id="goal" type="number" min="1" max="12" value="${state.goal}" onchange="state.goal=Number(this.value)||1;save();render()"></label></div><p class="sub">${state.examDate?`${Math.max(0,Math.ceil((new Date(state.examDate)-new Date())/86400000))} days until your exam date.`:'Add your exam date to see a countdown. No date is assumed.'}</p><button class="btn secondary" onclick="generatePlan()">Build revision schedule</button><div class="bar" style="margin-top:16px"><i style="width:${Math.min(100,(state.studyMins/(state.goal*60))*100)}%"></i></div><p class="sub" style="margin-top:7px">Today: ${state.studyMins} / ${state.goal*60} study minutes</p><button class="btn" style="margin-top:10px" onclick="state.studyMins+=25;save();render()">＋ Log 25-minute session</button></div><div class="card"><div class="eyebrow">ADD A TASK</div><div class="planner-form"><input id="taskName" placeholder="e.g. Revise AEIOU framework"><select id="taskUnit" class="select"><option>Unit 1</option><option>Unit 2</option><option>Unit 3</option></select><button class="btn" onclick="addTask()">Add</button></div><p class="sub">Choose topics to revise or add your own tasks.</p></div></div><div class="section-row"><div><h2>Revision tasks</h2><p class="sub">Stored locally in this browser.</p></div><button class="text-link" onclick="generatePlan()">Regenerate from syllabus →</button></div><div class="card">${state.tasks.length?state.tasks.map((t,i)=>`<label class="task ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask(${i})"><span style="flex:1">${t.text}</span><small class="sub">${t.unit||''}</small><button class="text-link" onclick="removeTask(${i})">Remove</button></label>`).join(''):'<p class="sub">No tasks yet. Generate a starter schedule or add a topic above.</p>'}</div>`}
function addTask(){let v=document.getElementById('taskName').value.trim();if(!v)return;state.tasks.push({text:v,unit:document.getElementById('taskUnit').value,done:false});save();render()}function toggleTask(i){state.tasks[i].done=!state.tasks[i].done;save();render()}function removeTask(i){state.tasks.splice(i,1);save();render()}function generatePlan(){let pending=topics.filter(t=>state.topicStatus[t.key]!=='Mastered');pending.sort((a,b)=>((state.cardStatus[a.key]&&state.cardStatus[a.key]!=='Know It')?-1:0)-((state.cardStatus[b.key]&&state.cardStatus[b.key]!=='Know It')?-1:0));state.tasks=pending.slice(0,12).map(t=>({text:`Revise: ${t.title}`,unit:`Unit ${t.unit}`,done:false}));save();render();toast('Revision schedule created from pending topics')}
function progress(){let weak=topics.filter(t=>state.cardStatus[t.key]&&state.cardStatus[t.key]!=='Know It');return `${header('YOUR LEARNING','Progress that feels achievable.','Your status is stored on this device, in this browser.')}<div class="grid stats"><div class="card stat"><div class="stat-head">Overall mastered</div><div class="stat-num">${pct()}%</div><div class="bar"><i style="width:${pct()}%"></i></div></div><div class="card stat"><div class="stat-head">Notes mastered</div><div class="stat-num">${doneCount()}<span style="color:var(--muted);font-size:15px">/${topics.length}</span></div></div><div class="card stat"><div class="stat-head">MCQs attempted</div><div class="stat-num">${state.mcqs}</div></div><div class="card stat"><div class="stat-head">Accuracy</div><div class="stat-num">${state.mcqs?Math.round(state.correct/state.mcqs*100):0}%</div></div></div><div class="grid two"><div class="card"><h2>By unit</h2>${syllabus.map(u=>{let n=u.topics.filter((_,i)=>state.topicStatus[`${u.unit}-${i}`]==='Mastered').length;return `<div style="margin:16px 0"><div class="subject-foot"><span>Unit ${u.unit} · ${u.title}</span><span>${n}/${u.topics.length}</span></div><div class="bar" style="margin-top:8px"><i style="width:${Math.round(n/u.topics.length*100)}%"></i></div></div>`}).join('')}</div><div class="card"><h2>Study habits</h2><div class="list-row"><div class="row-main"><b>Daily study target</b><small>Personal goal; adjust in Study Planner</small></div><strong>${state.goal} h</strong></div><div class="list-row"><div class="row-main"><b>Study sessions logged</b><small>25 minutes per logged session</small></div><strong>${Math.floor(state.studyMins/25)}</strong></div><div class="list-row"><div class="row-main"><b>Bookmarks</b><small>Questions and revision topics</small></div><strong>${state.bookmarks.length}</strong></div><div class="list-row"><div class="row-main"><b>Revision queue</b><small>Cards marked for practice/review</small></div><strong>${weak.length}</strong></div></div></div><div class="section-row"><div><h2>Unit coverage</h2><p class="sub">Change topic status from your Notes page.</p></div><button class="btn secondary" onclick="setPage('notes')">Go to notes →</button></div><div class="card">${syllabus.map(u=>`<div class="list-row"><div class="bullet">0${u.unit}</div><div class="row-main"><b>${u.title}</b><small>${u.topics.filter((_,i)=>state.topicStatus[`${u.unit}-${i}`]==='Mastered').length} mastered · ${u.topics.length} total · ${u.topics.length-u.topics.filter((_,i)=>state.topicStatus[`${u.unit}-${i}`]==='Mastered').length} remaining</small></div></div>`).join('')}</div>`}
function settings(){return `${header('PREFERENCES','Settings.','Make Studyroom comfortable for your study routine.')}<div class="card" style="max-width:760px"><div class="setting"><div><b>Appearance</b><p>Switch between the default dark theme and light theme.</p></div><button class="btn secondary" onclick="toggleTheme()">${state.theme==='light'?'☾ Dark':'☼ Light'} mode</button></div><div class="setting"><div><b>Progress storage</b><p>Saved locally in this browser using localStorage. It does not sync across devices.</p></div><span class="pill">On this device</span></div><div class="setting"><div><b>Study subject</b><p>Design Thinking · INT335 · Units 1–3</p></div><span class="pill">3 units</span></div><div class="setting"><div><b>Reset local progress</b><p>Remove locally saved topic states, scores, cards and tasks.</p></div><button class="btn red" onclick="resetData()">Reset data</button></div><p class="sub" style="margin-top:16px;font-size:11px">Question bank and notes are fixed course content in this build. Live AI question generation and multi-device sync need an AI service and backend and are not represented as active features.</p></div>`}
function toggleTheme(){state.theme=state.theme==='light'?'dark':'light';save();document.documentElement.dataset.theme=state.theme;render()}function markTopic(key,value){state.topicStatus[key]=value;save();render();toast(`Marked ${value.toLowerCase()}`)}function bookmarkTopic(key){let b='t'+key;state.bookmarks.includes(b)?state.bookmarks.splice(state.bookmarks.indexOf(b),1):state.bookmarks.push(b);save();toast('Revision bookmark updated')}function bookmarkQuestion(id){let b='q'+id;state.bookmarks.includes(b)?state.bookmarks.splice(state.bookmarks.indexOf(b),1):state.bookmarks.push(b);save();render()}function resetData(){if(confirm('Reset all Studyroom data saved in this browser?')){localStorage.removeItem('studyroom-int335');location.reload()}}function toggleMenu(){document.getElementById('sidebar').classList.toggle('open')}let toastTimer;function toast(msg){let x=document.getElementById('toast');x.textContent=msg;x.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>x.hidden=true,1900)}
function render(){let f={dashboard,notes,mcq,priority,questions:importantQuestions,flashcards,mock:mockPage,reference,planner,progress,settings};document.getElementById('app').innerHTML=(f[page]||dashboard)();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('crumb').textContent=navItems.find(n=>n[0]===page)?.[2]||'Dashboard';if(mock?.active){} }
document.getElementById('globalSearch').addEventListener('input',()=>{if(page==='notes')render();else if(document.getElementById('globalSearch').value.trim()){unitFilter='all';setPage('notes')}});document.documentElement.dataset.theme=state.theme||'dark';render();
</script></body></html>
